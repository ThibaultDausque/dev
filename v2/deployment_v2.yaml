apiVersion: apps/v1
kind: Deployment
metadata:
  name: v2
  labels:
    app: v2-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: v2
  template:
    metadata:
      labels:
        app: v2
    spec:
      containers:
      - name: v2
        image: wil42/playground:v2
        ports:
        - containerPort: 8888

---

apiVersion: v1
kind: Service
metadata:
  name: v2
spec:
  selector:
    app.kubernetes.io/name: v2
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-v2
spec:
  rules:
  - host: "v2.com"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: v2-service
            port:
              number: 8888

