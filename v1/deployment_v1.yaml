apiVersion: apps/v1
kind: Deployment
metadata:
  name: v1-deployment
  labels:
    app: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: v1
  template:
    metadata:
      labels:
        app: v1
    spec:
      containers:
      - name: v1
        image: wil42/playground:v1
        ports:
        - containerPort: 8888

---

apiVersion: v1
kind: Service
metadata:
  name: v1-service
spec:
  type: ClusterIP
  selector:
    app: v1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8888

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-v1
spec:
  rules:
  - host: "v1.com"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: v1-service
            port:
              number: 80

